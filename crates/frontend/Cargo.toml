[package]
name = "frontend"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
yew = { version = "0.23.0", features = ["csr"] }
yewdux = "0.13.0"
yew-router = "0.20"
yew-hooks = "0.6.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-logger = "0.2.0"
js-sys = "0.3"
web-sys = { version = "0.3.107", features = ["Request", "RequestInit", "Response"] }
tauri-sys = { git = "https://github.com/JonasKruckenberg/tauri-sys", rev = "571cef4", features = ["all"] }
types = { path = "../types" }
gloo-storage = "0.4.0"
gloo-console = "0.4.1"
gloo-net = "0.7.0"
reqwest = { version = "0.13.5", features = ["json"] }
http = "1.5.0"
once_cell = "1.21.4"
async-trait = "0.1.92"
email_address = "0.2.9"
