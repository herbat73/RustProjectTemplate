[package]
name = "infrastructure"
version = "0.1.0"
edition = "2024"

# Implements the ports of `domain` and `application` with concrete technology:
# SQL (sqlx), bcrypt, JWT, SMTP and in-memory stores.

[dependencies]
domain = { path = "../domain" }
application = { path = "../application" }
async-trait = "0.1"
sqlx = { version = "0.9.0", features = ["postgres", "sqlite", "any", "runtime-tokio", "tls-rustls"] }
tokio = { version = "1.54", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
bcrypt = { version = "0.19.3" }
lettre = "0.11.23"
rand = "0.10.3"
