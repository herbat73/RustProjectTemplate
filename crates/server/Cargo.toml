[package]
name = "server"
version = "0.1.0"
edition = "2024"

# Presentation layer and composition root: the axum HTTP/WebSocket API.
# Controllers translate HTTP to use-case calls of `application`; `bootstrap` wires the
# concrete `infrastructure` implementations into those use cases.

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
tower-http = { version = "0.7", features = ["cors"] }
tokio = { version = "1.54", features = ["full"] }
serde_json = "1.0.154"
http = "1.5.0"
futures = "0.3.34"
dotenv = "0.15.0"
utoipa = "6.0"

types = { path = "../types", features = ["openapi"] }
domain = { path = "../domain" }
application = { path = "../application" }
infrastructure = { path = "../infrastructure" }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
sqlx = { version = "0.9.0", features = ["postgres", "sqlite", "any", "runtime-tokio", "tls-rustls", "migrate"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
base64 = "0.23.1"
uuid = { version = "1.29.0", features = ["v4"] }
