[package]
name = "server"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
axum-extra = { version = "0.12.6", features = ["typed-header", "cookie", "cookie-signed"] }
tower-http = { version = "0.7", features = ["cors"] }
tokio = { version = "1.54", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }

types = { path = "../types", features = ["sqlx"] }
dotenv = "0.15.0"
sqlx = { version = "0.9.0", features = ["postgres", "sqlite", "any", "runtime-tokio", "tls-rustls"] }
once_cell = "1.21.4"
uuid = { version = "1.29.0", features = ["v4"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
bcrypt = { version = "0.19.3"  }
serde_json = "1.0.154"
http = "1.5.0"
tower = "0.5.3"
cookie = "0.18.2"
struct_iterable = "0.1.1"
base64 = "0.23.1"
email_address = "0.2.9"
futures = "0.3.34"
lettre = "0.11.23"
rand = "0.10.3"

[features]
sqlite = []
postgres = []

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
